spring.application.name=project

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.swagger-ui.path=/bacteria-resistant.html

# Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/bacteria_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agario}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rotas AI e JWT
ai.engine.url=${AI_ENGINE_URL:http://localhost:8023/predict}
api.security.token.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:mysql://localhost:3308/bacteria_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:agario}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}

# Storage AWS S3 (MinIO)
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${S3_BUCKET:genomes}