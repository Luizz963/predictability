spring.application.name=project
spring.config.import=optional:file:./application-local.properties

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.swagger-ui.path=/bacteria-resistant.html

# Banco de Dados — senhas e usuários vêm de variáveis de ambiente ou de application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/${DB_NAME:bacteria_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.flywaydb=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Rotas AI e JWT
python.api.url=${AI_ENGINE_URL:http://localhost:5000/predict}
api.security.token.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:mysql://localhost:3308/${DB_NAME:bacteria_db}?allowPublicKeyRetrieval=true&useSSL=false}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# Storage AWS S3 (MinIO)
aws.s3.endpoint=${AWS_S3_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:${S3_ACCESS_KEY}}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:${S3_SECRET_KEY}}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${S3_BUCKET:genomes}

python.api.internal-key=${BACRESIST_INTERNAL_KEY}
