services:
  mysql-db:
    image: mysql:8.0
    container_name: bacteria-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bacresist-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  minio-storage:
    image: minio/minio
    container_name: bacteria-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - bacresist-network

  minio-create-bucket:
    image: minio/mc
    container_name: bacteria-minio-setup
    depends_on:
      - minio-storage
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio ${S3_ENDPOINT} ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      /usr/bin/mc mb myminio/${S3_BUCKET} --ignore-existing;
      /usr/bin/mc anonymous set private myminio/${S3_BUCKET};
      exit 0;
      "
    networks:
      - bacresist-network

  python-ai:
    build: C:\IA\bacresist-inference
    environment:
      - BACRESIST_INTERNAL_KEY=${BACRESIST_INTERNAL_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    container_name: bacresist-ia
    ports:
      - "8023:8023"
    networks:
      - bacresist-network

  bacresist-java:
    build: .
    container_name: bacresist-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bacteria-mysql:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_FLYWAY_URL=jdbc:mysql://bacteria-mysql:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      - AI_ENGINE_URL=http://python-ai:8023/predict
      - BACRESIST_INTERNAL_KEY=${BACRESIST_INTERNAL_KEY}
      - AWS_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${S3_SECRET_KEY}
      - AWS_S3_ENDPOINT=${S3_ENDPOINT}
      - AWS_REGION=us-east-1
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql-db:
        condition: service_healthy
      python-ai:
        condition: service_started
    networks:
      - bacresist-network

networks:
  bacresist-network:
    driver: bridge

volumes:
  mysql_data:
  minio_data: